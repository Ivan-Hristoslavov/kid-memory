<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    The MENTY app icon, as drawn on the brand identity sheet: a blush rounded
    square carrying an ivory M and the heart. It replaced a pink-to-violet
    gradient left over from the previous brand, which shared no colour with
    this one.

    The M is drawn as a path rather than set as text: a favicon is rendered
    without the page's webfonts, so live text would fall back to whatever the
    browser had and the mark would change shape per device.
  -->
  <rect width="64" height="64" rx="16" fill="#D4A59A"/>
  <path d="M15 45V19h6.6l10.4 15.2L42.4 19H49v26h-6.4V29.7L33.6 42h-3.2L21.4 29.7V45H15Z" fill="#FEFCF8"/>
  <path d="M52 15.2a3.4 3.4 0 0 0-5 0l-.6.6-.6-.6a3.4 3.4 0 0 0-4.9 4.7l5.5 5.6 5.6-5.6a3.4 3.4 0 0 0 0-4.7Z" fill="#FEFCF8"/>
</svg>
